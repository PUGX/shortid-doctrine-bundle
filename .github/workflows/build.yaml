name: Continuous Integration

on:
    push:
        branches:
            - master
    pull_request: ~

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
            - name: Validate composer.json
              run: composer validate --strict --no-check-lock
    cs-fixer:
        runs-on: ubuntu-24.04
        name: PHP-CS-Fixer
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Fix CS
              uses: docker://oskarstark/php-cs-fixer-ga
              with:
                args: --diff --dry-run
    tests:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - description: 'PHP 8.2 - No Symfony specified'
                      php: '8.2'
                    - description: 'PHP 8.3 - No Symfony specified'
                      php: '8.3'
                    - description: 'PHP 8.4 - No Symfony specified'
                      php: '8.4'
                    - description: 'PHP 8.5 - No Symfony specified'
                      php: '8.5'
                    - description: 'Lowest deps'
                      php: '8.2'
                      dependencies: lowest
                      env:
                          SYMFONY_DEPRECATIONS_HELPER: max[self]=0
                    - description: 'Symfony 6.4'
                      php: '8.3'
                      symfony: 6.4.*
                    - description: 'Symfony 7.4'
                      php: '8.4'
                      symfony: 7.4
                    - description: 'Latest'
                      php: '8.5'
                      symfony: 8.1.*
        name: PHP ${{ matrix.php }} tests (${{ matrix.description }})
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: flex
            - name: Allow dev dependencies
              run: composer config minimum-stability dev && composer config prefer-stable true
              if: contains(matrix.symfony, '@dev')
            - name: Install dependencies
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: ${{ matrix.dependencies }}
              env:
                  COMPOSER_NO_SECURITY_BLOCKING: 1
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}
            - name: Run tests
              run: vendor/phpunit/phpunit/phpunit --colors=always

